<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyFlow - Student Productivity Hub</title>
  <link rel="stylesheet" href="IDCC.css" />
</head>
<body>

  <header class="navbar">
    <div class="logo">Study Flow</div>
    <div class="division-tag">Study Timer and Checklist</div>
  </header>

  <main class="container">
    <section class="intro">
      <h1>Stay Focused, <em>Track Your Revision</em></h1>
    </section>

    <div class="grid">

      <section class="card timer-card">
        <h2>Focus Timer</h2>
        <div class="timer-mode">
          <button id="mode-study" class="mode-btn active" onclick="setTimerMode(25)">Study (25m)</button>
          <button id="mode-break" class="mode-btn" onclick="setTimerMode(5)">Short Break (5m)</button>
        </div>
        
        <div class="timer-display" id="time-display">25:00</div>
        
        <div class="timer-controls">
          <button id="start-btn" class="btn btn-primary" onclick="startTimer()">Start</button>
          <button id="pause-btn" class="btn btn-outline" onclick="pauseTimer()">Pause</button>
          <button id="reset-btn" class="btn btn-outline" onclick="resetTimer()">Reset</button>
        </div> 
      </section>

      <section class="card tasks-card">
        <h2>Session Checklist</h2>
        <form id="task-form" onsubmit="handleAddTask(event)">
          <div class="input-group">
            <input type="text" id="task-input" placeholder="Add checklist" required />
            <button type="submit" class="btn btn-primary">Add</button>
          </div>
        </form>

        <ul class="task-list" id="task-list"></ul>

        <div class="task-summary">
          <span>Completed: <strong id="completed-count">0</strong></span>
          <span>Remaining: <strong id="remaining-count">0</strong></span>
        </div>
      </section>
    </div>
  </main>

  <script src="IDCC.js"></script>
</body>
</html>
